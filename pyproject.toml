[project]
name = "stethopote"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Johan Bartosik", email = "jojo.bartosik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cohere>=7.0.9",
    "openai>=3.3.1",
    "pinecone>=9.1.0",
    "pinecone-text>=0.11.0",
    "protobuf==3.20.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "streamlit>=1.60.0",
    "supabase>=2.31.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
stethopote = "stethopote:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
